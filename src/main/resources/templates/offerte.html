<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offerte</title>

    <!-- LINK -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/root.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/offerte.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/freccia.css}">
</head>

<body>
<!--NAVBAR-->
<div th:replace="fragments/navbar :: navbar"></div>
<section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
        <h1>Offerte</h1>
        <p>
            Scopri tutte le nostre offerte e attività del mondo Siediti & Guarda e dei film in uscita.
        </p>
    </div>
</section>

<main class="site-main">

    <!-- FILTRI -->
    <section class="filter-section" aria-label="Filtri contenuti">

        <form class="filter-form">
            <label class="radio">
                <input type="radio" name="filter" value="all" checked>
                <span>Tutti</span>
            </label>
            <label class="radio">
                <input type="radio" name="filter" value="evento">
                <span>Eventi</span>
            </label>
            <label class="radio">
                <input type="radio" name="filter" value="anteprima">
                <span>Anteprime</span>
            </label>
            <label class="radio">
                <input type="radio" name="filter" value="menu">
                <span>Bar</span>
            </label>
        </form>

    </section>

    <!-- CONTENUTO -->
    <section class="cards-section" aria-label="Lista contenuti">

        <div class="cards-grid"  id="cardsContainer">
            <article class="card" th:each="offerta : ${offerte}" th:attr="data-type=${offerta.genere}">
                <figure class="card-media">
                        <img th:src="@{${offerta.img_banner}}" alt="Immagine offerta">
                    <!-- WAVE ATTACCATA ALL’IMMAGINE -->
                    <div class="card-wave">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="#273444" fill-opacity="1" d="M0,64L48,53.3C96,43,192,21,288,58.7C384,96,480,192,576,218.7C672,245,768,203,864,154.7C960,107,1056,53,1152,32C1248,11,1344,21,1392,26.7L1440,32L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>
                    </div>
                    <!-- ICONA ROTANTE -->
                    <a class="card-icon">
                        <img class="icon-svg"
                             th:src="@{'./svg/' + ${offerta.genere} + '.svg'}" th:alt="${offerta.genere}">
                    </a>
                </figure>

                <div class="card-body">
                    <h2 class="card-title" th:text="${offerta.nome}"></h2>

                    <p class="card-text" th:text="${offerta.descrizione}"></p>

                    <a class="card-link" th:href="@{'/offerte/dettagli/' + ${offerta.id}}">
                        Scopri di più
                    </a>
                </div>
            </article>

        </div>

    </section>

</main>
<!-- FOOTER -->
<div th:replace="fragments/footer :: content"></div>
<div th:replace="fragments/footer :: social"></div>
<div th:replace="fragments/footer :: copyright"></div>

<script src="./js/offerte.js"></script>
<script src="./js/freccia.js"></script>
</body>

</html>
