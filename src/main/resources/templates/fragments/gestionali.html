<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">

<head>
    <meta charset="UTF-8">
</head>

<body>

<!-- ============================================================
     FRAGMENT: FORM OFFERTE
     Uso: <main th:replace="~{fragments/gestionali :: formOfferte}">
     ============================================================ -->
<section id="offerte" class="page-main" th:fragment="formOfferte">
    <div class="container formFilm">
        <div class="row g-4">

            <!-- COLONNA SINISTRA -->
            <div class="col-md-6 form-section">
                <div class="form-group">
                    <label class="form-label">Titolo Offerta</label>
                    <input type="text" class="form-control" id="titoloOfferta">
                </div>

                <div class="form-group">
                    <label for="filmOfferta" class="form-label">
                        Film
                    </label>
                    <select id="filmOfferta" class="form-select">
                        <option value="" selected>
                            Seleziona Film
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label d-block">Genere Offerta</label>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="genere" id="genereEvento" value="evento">
                        <label class="form-check-label" for="genereEvento">Eventi</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="genere" id="genereBar" value="bar">
                        <label class="form-check-label" for="genereBar">Bar</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="genere" id="genereAnteprima" value="anteprima">
                        <label class="form-check-label" for="genereAnteprima">Anteprime</label>
                    </div>
                </div>
            </div>

            <!-- COLONNA DESTRA -->
            <div class="col-md-6 form-section">
                <div class="form-group">
                    <label class="form-label">Descrizione</label>
                    <textarea class="form-control" id="descrizioneOfferta"></textarea>
                </div>
            </div>

            <!-- DATE -->
            <div class="col-md-6 form-group">
                <label class="form-label">Data Inizio</label>
                <input type="date" class="form-control" id="dataInizioOfferta">
            </div>
            <div class="col-md-6 form-group">
                <label class="form-label">Data Scadenza</label>
                <input type="date" class="form-control" id="dataScadenzaOfferta">
            </div>

            <!-- PREZZO + IMMAGINI -->
            <div class="col-md-3 form-group">
                <label class="form-label">Prezzo (solo Bar)</label>
                <input
                        type="number"
                        class="form-control"
                        id="prezzoOfferta"
                        step="0.01"
                        min="0"
                        disabled
                >
            </div>
            <div class="col-md-3 form-group">
                <label class="form-label">Immagine Card (URL)</label>
                <input type="url" class="form-control" id="imgBanner" placeholder="https://...">
            </div>
            <div class="col-md-3 form-group">
                <label class="form-label">Immagine Toplist (URL)</label>
                <input type="url" class="form-control" id="imgBannerTopOfferte" placeholder="https://...">
            </div>
            <div class="col-md-3 form-group">
                <label class="form-label">Immagine Dettaglio (URL)</label>
                <input type="url" class="form-control" id="imgDettaglio" placeholder="https://...">
            </div>

            <!-- BOTTONI -->
            <div class="col-12 form-actions">
                <button type="submit" class="btn btn-outline-warning">Conferma</button>
                <button type="reset" class="btn btn-outline-danger">Annulla</button>
            </div>

        </div>
    </div>
</section>

<!-- ============================================================
     FRAGMENT: FORM PROGRAMMAZIONE
     Uso: <main th:replace="~{fragments/gestionali :: formProgrammazione}">
     ============================================================ -->

        <section id="programmazione" class="page-main" th:fragment="formProgrammazione">
            <div class="container formFilm">

                <div class="row g-4">
                    <!-- SINISTRA -->
                    <div class="col-md-6 form-section">
                        <div class="form-group">
                            <label class="form-label">
                                Film
                            </label>
                            <select id="filmSalaProgrammazione" class="form-select">
                                <option selected disabled>
                                    Seleziona film...
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">
                                Data programmazione
                            </label>
                            <input id="dataProgrammazione" type="date" class="form-control">
                        </div>

                    </div>

                    <!-- DESTRA SALE -->
                    <div class="col-md-6 form-section">
                        <label class="form-label d-block">
                            Sala
                        </label>

                        <div class="row sale-wrapper" id="saleContainer">
<!--                            CONTENUTO DINAMICO SALE-->
                        </div>
                    </div>

                    <!-- ORARI -->
                    <div class="col-12">
                        <h2 class="programmazione-title">
                            Orari disponibili
                        </h2>

                        <div class="orari-grid">
                            <!-- qui poi li generiamo da JS -->
                        </div>
                    </div>

                    <!-- BOTTONI -->
                    <div class="col-12 form-actions">
                        <button type="submit" class="btn btn-outline-warning">
                            Conferma
                        </button>

                        <button type="reset" class="btn btn-outline-danger">
                            Annulla
                        </button>
                    </div>

                </div>
            </div>
        </section>

<!-- ============================================================
     FRAGMENT: FORM FILM
     Uso: <section th:replace="~{fragments/gestionali :: formFilm}">
     ============================================================ -->
<section class="page-main" th:fragment="formFilm">
    <div class="container formFilm">
        <div id="film">
            <div class="row g-4">

                <!-- COLONNA SINISTRA -->
                <div class="col-md-6 form-section">
                    <div class="form-group">
                        <label class="form-label">Titolo Film</label>
                        <input type="text" class="form-control" id="titoloFilm">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Distribuzione</label>
                        <input type="text" class="form-control" id="distribuzione">
                    </div>
                    <div class="form-group">
                        <label class="form-label d-block">Genere</label>
                        <div class="row" id="genereContainer">
                            <!-- generato dinamicamente da JS -->
                        </div>
                    </div>
                </div>

                <!-- COLONNA DESTRA -->
                <div class="col-md-6 form-section">
                    <div class="form-group">
                        <label class="form-label">Regista</label>
                        <input type="text" class="form-control" id="regista">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Cast</label>
                        <input
                                type="text"
                                class="form-control"
                                id="cast">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Sinossi</label>
                        <textarea class="form-control" id="sinossi"></textarea>
                    </div>
                </div>
                <!-- DATE + DURATA -->
                <div class="col-md-4 form-group">
                    <label class="form-label">Data Uscita</label>
                    <input type="date" class="form-control" id="dataUscita">
                </div>
                <div class="col-md-4 form-group">
                    <label class="form-label">Data Fine Programmazione</label>
                    <input type="date" class="form-control" id="dataFine">
                </div>
                <div class="col-md-4 form-group">
                    <label class="form-label">Durata (minuti)</label>
                    <input type="number" class="form-control" id="durataFilm">
                </div>

                <!-- LINGUE (ITA / ENG) -->
                <div class="col-md-4 form-group">
                    <label class="form-label d-block">Italiano</label>
                    <div class="row" id="formatoItaContainer">
                        <!-- generato dinamicamente da JS -->
                    </div>
                </div>

                <div class="col-md-4 form-group">
                    <label class="form-label d-block">Inglese</label>
                    <div class="row" id="formatoEngContainer">
                        <!-- generato dinamicamente da JS -->
                    </div>
                </div>

                <!-- PREZZO -->
                <div class="col-md-4 form-group">
                    <label class="form-label">Prezzo</label>
                    <input type="number" class="form-control" id="prezzoFilm">
                </div>

                <!-- IMMAGINI (URL) -->
                <div class="col-md-4 form-group">
                    <label class="form-label">Immagine Copertina (URL)</label>
                    <input type="url" class="form-control" id="imgCopertina" placeholder="https://...">
                </div>
                <div class="col-md-4 form-group">
                    <label class="form-label">Immagine Locandina (URL)</label>
                    <input type="url" class="form-control" id="imgLocandina" placeholder="https://...">
                </div>
                <div class="col-md-4 form-group">
                    <label class="form-label">Immagine Logo (URL)</label>
                    <input type="url" class="form-control" id="imgLogo" placeholder="https://...">
                </div>

                <!-- PARTNERSHIP -->
                <div class="col-md-4 form-group">
                    <label class="form-label">Immagine Partnership (URL)</label>
                    <input type="url" class="form-control" id="imgPartnership" placeholder="https://...">
                </div>
                <div class="col-md-4 form-group">
                    <label class="form-label">Titolo Partnership</label>
                    <input type="text" class="form-control" id="titoloPartnership">
                </div>

                <div class="col-md-2 form-group">
                    <label class="form-label d-block">Partnership</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="partnership" id="partnershipSi" value="si">
                        <label class="form-check-label" for="partnershipSi">Sì</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="partnership" id="partnershipNo" value="no">
                        <label class="form-check-label" for="partnershipNo">No</label>
                    </div>
                </div>

                <div class="col-md-2 form-group">
                    <label class="form-label d-block">Stato Film</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="statoFilm" id="statoInSala" value="inSala">
                        <label class="form-check-label" for="statoInSala">In Sala</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="statoFilm" id="statoArchiviato" value="archiviato">
                        <label class="form-check-label" for="statoArchiviato">Archiviato</label>
                    </div>
                </div>

                <!-- BOTTONI -->
                <div class="col-12 form-actions">
                    <button type="submit" class="btn btn-outline-warning">Conferma</button>
                    <button type="reset" class="btn btn-outline-danger">Annulla</button>
                </div>

            </div>
        </div>
    </div>
</section>

<!-- ============================================================
     FRAGMENT: FORM UTENTI  ← placeholder, da personalizzare
     Uso: <section th:replace="~{fragments/gestionali :: formUtenti}">
     ============================================================ -->
<section id="utenti" class="page-main" th:fragment="formUtenti">

    <div class="container formFilm">
        <div id="utenteForm">
            <div class="row g-4">
                <!-- =========================================
                     SINISTRA
                     ========================================= -->

                <div class="col-md-6 form-section">

                    <div class="form-group">

                        <label class="form-label" for="nome">Nome</label>
                        <input
                                type="text"
                                class="form-control"
                                id="nome"
                                name="nome"
                                required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="cognome">Cognome</label>
                        <input
                                type="text"
                                class="form-control"
                                id="cognome"
                                name="cognome"
                                required>
                    </div>
                </div>


                <!-- =========================================
                     DESTRA
                     ========================================= -->

                <div class="col-md-6 form-section">

                    <!-- EMAIL -->
                    <div class="form-group">
                        <label class="form-label" for="email">Email
                        </label>
                        <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                required>
                    </div>

                    <!-- RUOLO -->
                    <div class="form-group">
                        <label class="form-label d-block">Ruolo</label>
                        <div id="ruoliContainer">
                            <!-- dinamicamente  -->
                        </div>
                    </div>
                </div>


                <!-- =========================================
                     BOTTONI
                     ========================================= -->

                <div class="col-12 form-actions">
                    <button type="button" id="btnConfermaUtente" class="btn btn-outline-warning">Conferma</button>
                    <button type="button" id="btnAnnullaUtente" class="btn btn-outline-danger">Annulla</button>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- ============================================================
     FRAGMENT: TABELLA OFFERTE
     Uso: <section th:replace="~{fragments/gestionali :: tabellaOfferte}">
     ============================================================ -->
<section id="tabsOffers" class="section-layout" th:fragment="tabellaOfferte">
    <div class="container">

        <h1 class="section-title h1">Database Offerte</h1>

        <div class="row" id="Offers">
            <div class="col-12">
                <table id="tableOffers" class="table table-striped dataTable-init">
                    <thead>
                    <tr>
                        <th>Id</th>
                        <th>Titolo</th>
                        <th>Categoria</th>
                        <th>Data</th>
                        <th>Azioni</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- CONTENUTO DINAMICO -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<!-- ============================================================
     FRAGMENT: TABELLA PROGRAMMAZIONE
     Uso: <section th:replace="~{fragments/gestionali :: tabellaProgrammazione}">
     ============================================================ -->
<section id="tabsScheduling" class="section-layout" th:fragment="tabellaProgrammazione">
    <div class="container">

        <h1 class="section-title h1">Database Programmazione</h1>

        <div class="row" id="Scheduling">
            <table id="tableScheduling" class="table table-striped dataTable-init">
                <thead>
                <tr>
                    <th>Titolo</th>
                    <th>Sala</th>
                    <th>Data</th>
                    <th>Azioni</th>
                </tr>
                </thead>
                <tbody>
<!--                CONTENUTO DINAMICO-->
                </tbody>
            </table>
        </div>
    </div>
</section>

<!-- ============================================================
     FRAGMENT: TABELLA UTENTI
     Uso: <section th:replace="~{fragments/gestionali :: tabellaUtenti}">
     ============================================================ -->
<section id="tabsUsers" class="section-layout" th:fragment="tabellaUtenti">
    <div class="container">
        <h1 class="section-title h1">Database Utenti</h1>
        <div class="row" id="Users">
            <table id="tableUsers" class="table table-striped dataTable-init">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Nome</th>
                    <th>Cognome</th>
                    <th>Email</th>
                    <th>Ruolo</th>
                    <th>Azioni</th>
                </tr>
                </thead>
                <tbody id="usersTableBody">
                <!--dinamicamente  -->
                </tbody>
            </table>
        </div>
    </div>
</section>


<!-- ============================================================
     FRAGMENT: TABELLA FILM (con tab In Sala / Archivio)
     Uso: <section th:replace="~{fragments/gestionali :: tabellaFilm}">
     ============================================================ -->
<section id="tabsFilm" class="section-layout" th:fragment="tabellaFilm">
    <div class="container">

        <h1 class="section-title h1">Database Film</h1>

        <ul class="nav nav-tabs nav-fill" id="filmTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="film-in-sala-tab" data-bs-toggle="tab"
                        data-bs-target="#film-in-sala-pane" type="button" role="tab"
                        aria-controls="film-in-sala-pane" aria-selected="true">
                    In Sala
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="film-archivio-tab" data-bs-toggle="tab"
                        data-bs-target="#film-archivio-pane" type="button" role="tab"
                        aria-controls="film-archivio-pane" aria-selected="false">
                    Archivio
                </button>
            </li>
        </ul>

        <div class="tab-content py-3 px-3 px-sm-0" id="filmTabContent">

            <!-- TAB: IN SALA -->
            <div class="tab-pane fade show active" id="film-in-sala-pane" role="tabpanel"
                 aria-labelledby="film-in-sala-tab" tabindex="0">
                <div class="row" id="tabInSala">
                    <div class="col-12">
                    <table id="tableFilmInSala" class="table table-striped dataTable-init">
                        <thead>
                        <tr>
                            <th>Id</th>
                            <th>Titolo Film</th>
                            <th>Distribuzione</th>
                            <th>Data Uscita</th>
                            <th>Azioni</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- CONTENUTO DINAMICO -->
                        </tbody>
                    </table>
                    </div>
                </div>
            </div>

            <!-- TAB: ARCHIVIO -->
            <div class="tab-pane fade" id="film-archivio-pane" role="tabpanel"
                 aria-labelledby="film-archivio-tab" tabindex="0">
                <div class="row" id="Archivio">
                    <div class="col-12">
                    <table id="tableFilmArchivio" class="table table-striped dataTable-init">
                        <thead>
                        <tr>
                            <th>Id</th>
                            <th>Titolo Film</th>
                            <th>Distribuzione</th>
                            <th>Data Uscita</th>
                            <th>Azioni</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- CONTENUTO DINAMICO -->
                        </tbody>
                    </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>



</body>
</html>
