<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/root.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/InSala.css}">
    <link rel="stylesheet" th:href="@{/css/titoloLinea.css}">
    <link rel="stylesheet" th:href="@{/css/freccia.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <title>In Sala</title>
</head>

<body>
<div th:replace="fragments/navbar :: navbar"></div>
<main class="container">

    <h1 class="titoloLinea" id="offerte">Film in Sala</h1>

    <div class="search-wrapper d-flex justify-content-center">
        <div class="input-group search-bar">

            <!-- Filtro genere -->
            <select class="form-select genre-select" id="genreSelect">
<!--                <option value="all" selected>Generi</option>-->
<!--                <option th:each="genere : ${generi}"-->
<!--                        th:value="${genere}"-->
<!--                        th:text="${genere}">-->
<!--                </option>-->
            </select>

            <!-- Ricerca per titolo -->
            <span class="input-group-text search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
            <input type="text" class="form-control search-input" id="searchInput" placeholder="Titoli" th:value="${preloadSearch}">

        </div>
    </div>

    <!-- GRID FILM -->
    <div class="movies-grid" id="moviesGrid">
        <!-- Messaggio se lista vuota -->
        <p th:if="${noResult}" class="text-center text-secondary mt-4">
            Nessun film attualmente in sala.
        </p>

        <!-- Card per ogni film -->
        <div class="col-6 col-md-4 movie-item" th:each="film : ${films}">
            <a th:href="@{/inSala/dettagli/{id}(id=${film.id})}" class="movie-card-link">
                <div class="movie-card">
                    <img th:src="${film.img_poster}" th:alt="${film.titolo}" alt="Locandina film">
                    <h2 th:text="${film.titolo}">Titolo Film</h2>
                </div>
            </a>
        </div>

    </div>
</main>

<!-- FOOTER -->
	<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/inSala.js"></script>
<script src="./js/freccia.js"></script>
<script src="./js/titoloLinea.js"></script>
</body>

</html>
