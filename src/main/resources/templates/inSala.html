<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/root.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/InSala.css}">
    <link rel="stylesheet" th:href="@{/css/titoloLinea.css}">
    <link rel="stylesheet" th:href="@{/css/freccia.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <title>In Sala</title>
</head>

<body>
<!--NAVBAR-->
<header id="return">
    <div th:replace="fragments/navbar :: logo"></div>
    <div th:replace="fragments/navbar :: menu"></div>
    <div th:replace="fragments/navbar :: user"></div>
</header>
<!--GRIGLIA-->
<main class="container">

    <h1 class="titoloLinea" id="offerte">Film in Sala</h1>

    <!-- ================= SEARCH ================= -->
    <div class="search-wrapper">
        <div class="input-group search-bar">

            <!-- GENERE -->
            <select class="form-select genre-select" id="genreSelect">
                <option value="all">Tutti i generi</option>
            </select>

            <!-- ICONA -->
            <span class="input-group-text search-icon">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>

            <!-- INPUT -->
            <input type="text"
                   class="form-control search-input"
                   id="searchInput"
                   placeholder="Cerca film...">

        </div>
    </div>

    <!-- ================= MOVIES GRID ================= -->
    <div class="movies-grid" id="moviesGrid">
        <!-- JS RENDERIZZA QUI -->
    </div>

    <!-- EMPTY STATE -->
    <p id="emptyState"
       class="text-center text-secondary mt-4"
       style="display:none;">
        Nessun film trovato
    </p>

</main>

<!-- FOOTER -->
<div th:replace="fragments/footer :: content"></div>
<div th:replace="fragments/footer :: social"></div>
<div th:replace="fragments/footer :: copyright"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/inSala.js"></script>
<script src="./js/freccia.js"></script>
<script src="./js/titoloLinea.js"></script>
</body>

</html>
