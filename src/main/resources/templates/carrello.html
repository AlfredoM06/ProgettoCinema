<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/root.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/carrello.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/freccia.css}">

    <title>Carrello</title>
</head>

<body>
<!-- NAVBAR -->
<header id="return">
    <div th:replace="fragments/navbar :: logo"></div>
    <div th:replace="fragments/navbar :: menu"></div>
    <div th:replace="fragments/navbar :: account"></div>
</header>

<!-- CONTENUTO -->
<main class="cart-main">
    <div class="container cart-container">
        <div class="row">

            <!-- PRODOTTI -->
            <section class="col-lg-7">
                <section class="cart-box">
                    <div id="cart-items">
                        <!-- CONTENUTO DINAMICO JS -->
                    </div>
                </section>
            </section>

            <!-- ASIDE -->
            <aside class="col-lg-5">

                <!-- UTENTE -->
                <section class="user-box">
                    <div class="user-header">
                        <p>
                            Ciao <strong th:text="${#authentication.principal.username}">Utente</strong>,
                        </p>
                        <!-- Immagine carta solo se ha la membership -->
                        <img th:if="${#authentication.principal.membership}"
                             class="points-card"
                             src="/img/card_myS&G.webp"
                             alt="Carta punti">
                    </div>
                    <p class="points-box">
                        Il tuo carrello può farti guadagnare
                        <strong id="puntiDinamici"
                                th:text="${carrello.punti} + ' punti'">
                            0 punti
                        </strong>
                    </p>
                </section>

                <!-- RIEPILOGO -->
                <section class="summary-box">
                    <h2>Riepilogo</h2>
                    <dl class="container-summary">

                        <div class="summary-row">
                            <dt>Prezzo di riferimento</dt>
                            <dd id="summary-prezzo-riferimento">0,00€</dd>
                        </div>

                        <!-- Sconto visibile solo con membership -->
                        <div class="summary-row discount"
                             id="summary-sconto-row"
                             th:style="${#authentication.principal.membership} ? '' : 'display:none'">
                            <dt>Sconto (10%)</dt>
                            <dd id="summary-sconto">-0,00€</dd>
                        </div>

                        <div class="summary-row total">
                            <dt>Subtotale</dt>
                            <dd id="summary-subtotale">0,00€</dd>
                        </div>

                    </dl>

                    <button class="btn-checkout w-100" id="btn-acquista">
                        Acquista Ora
                    </button>
                </section>

            </aside>
        </div>
    </div>
</main>

<!-- FOOTER -->
<div th:replace="fragments/footer :: content"></div>
<div th:replace="fragments/footer :: social"></div>
<div th:replace="fragments/footer :: copyright"></div>

<!-- SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
<script th:src="@{/js/freccia.js}"></script>
<script th:inline="javascript">
    const CARRELLO = /*[[${carrello}]]*/ {};
    const MEMBERSHIP = /*[[${#authentication.principal.membership}]]*/ false;
</script>
<script th:src="@{/js/carrello.js}"></script>
</body>
</html>
