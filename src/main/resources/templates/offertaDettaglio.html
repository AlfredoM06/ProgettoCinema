<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offerte</title>

    <!-- LINK -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/root.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/offertaDettaglio.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/freccia.css}">
</head>

<body>
<!--NAVBAR-->
<div th:replace="fragments/navbar :: navbar"></div>
<!--HERO-->
<section class="hero-custom">
    <img th:src="@{/img/prova.jfif}">
</section>

<main>
    <div class="content-wrapper">
        <h1 th:text="${offerta.nome}"></h1>
        <h5 th:text="${offerta.data_inizio}"></h5>
        <p th:text="${offerta.descrizione}"></p>
        <button class="btn btnGadget">Acquista</button>
    </div>
</main>

<!--FOOTER-->
<div th:replace="fragments/footer :: content"></div>
<div th:replace="fragments/footer :: social"></div>
<div th:replace="fragments/footer :: copyright"></div>

<!--JS-->
<script src="./js/freccia.js"></script>
</body>
</html>
